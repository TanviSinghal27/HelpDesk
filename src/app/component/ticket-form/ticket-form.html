<div style="padding: 20px; font-family: sans-serif; max-width: 500px;">
  <h2>
    @if (isViewOnly) {<span>Ticket Details</span>}
    @else if(!isViewOnly && isEditMode){<span>Edit Ticket #{{ticketId}}</span>}
    @else{
    <span>Create New Ticket</span>
    }
  </h2>

  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label style="display:block; margin-bottom:5px;">Title:</label>
      <input type="text" formControlName="title" style="width: 100%; padding: 8px;" />
      <small *ngIf="ticketForm.get('title')?.touched && ticketForm.get('title')?.invalid" style="color:red;">
        Title is required (min 3 characters).
      </small>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; margin-bottom:5px;">Description:</label>
      <textarea formControlName="description" rows="4" style="width: 100%; padding: 8px;"></textarea>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; margin-bottom:5px;">Status:</label>
      <select formControlName="status" style="width: 100%; padding: 8px;">
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div style="margin-top: 20px;">
      <button type="submit" *ngIf="!isViewOnly" [disabled]="ticketForm.invalid"
        style="padding: 8px 15px; margin-right: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
        Save Ticket
      </button>
      <button type="button" [routerLink]="['/']"
        style="padding: 8px 15px; background-color: #ccc; border: none; cursor: pointer;">
        Back to List
      </button>
    </div>
  </form>
</div>
